<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Mafia King — Chapter V: The One Who Came Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0807;--char:#15110f;--ivory:#efe6d6;--ivory-d:#b9ae9c;
  --crim:#7a1226;--crim-d:#3d0a14;--gold:#c2a15a;--amber:#e0a458;
  --serif:'Cormorant Garamond','Cormorant',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --glow:rgba(122,18,38,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  min-height:100vh;
  min-height:100dvh;
  background:var(--ink);
  color:var(--ivory);
  overflow:hidden;
  position:relative;
  -webkit-tap-highlight-color:transparent;
}
body{font-family:var(--serif)}
body.warm{--glow:rgba(224,164,88,.22)}
body.cold{--glow:rgba(122,18,38,.38)}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;user-select:none}
#bg{
  position:absolute;
  inset:-4%;
  background:
    radial-gradient(ellipse 70% 60% at 50% 42%,var(--glow),transparent 70%),
    linear-gradient(180deg,var(--char),var(--ink) 80%);
  transition:background 2.4s ease;
  animation:drift 40s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.2%,.8%)}}

.fog{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fog i{
  position:absolute;
  width:140%;
  height:60%;
  left:-20%;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(239,230,214,.07),transparent 65%);
  filter:blur(30px);
  animation:fog 38s linear infinite;
}
.fog i:nth-child(1){top:5%}.fog i:nth-child(2){top:48%;animation-duration:55s;animation-direction:reverse}
@keyframes fog{from{transform:translateX(-8%)}to{transform:translateX(8%)}}

#embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.82) 100%)}
.grain{
  position:absolute;
  inset:-50%;
  pointer-events:none;
  opacity:.07;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(4) infinite;
}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(3%,3%)}}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s ease;z-index:5}
#fade.on{opacity:1}

#view{
  position:relative;
  z-index:3;
  width:min(720px,90vw);
  max-height:86dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:0 12px;
}

#lines{
  max-height:64dvh;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.2rem;
  padding:0.8rem 0;
}

.beat{flex:none;width:100%;transition:opacity 2s ease}
.beat.old{opacity:.38}
.beat .who{opacity:1}

.who{
  font-family:var(--sans);
  font-size:clamp(.65rem, 2vw, .72rem);
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:.8rem;
  opacity:0;
  transition:opacity 1s;
}
.who.minho{color:#8fa6d8}.who.bangchan{color:#b3364f}.who.afu{color:#d9b8a2}
.beat .who:not(:first-child){margin-top:1.2rem}

.txt{
  font-size:clamp(1.25rem, 4.2vw, 2.1rem);
  line-height:1.48;
  font-weight:400;
  letter-spacing:.01em;
  word-break:break-word;
}
.txt.say::before{content:"“"}.txt.say::after{content:"”"}
.txt.nar{font-style:italic;color:var(--ivory-d)}
.txt.big{font-size:clamp(1.8rem, 6.5vw, 3.4rem);letter-spacing:.1em;font-weight:500;line-height:1.15}
.txt.sm{font-family:var(--sans);font-size:clamp(.7rem, 2vw, .78rem);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-style:normal}
.txt.th{color:var(--gold);font-style:italic}
.beat .txt+.txt{margin-top:.6rem}

.w{opacity:0;display:inline-block;transform:translateY(5px);filter:blur(3px);animation:w .9s ease forwards}
@keyframes w{to{opacity:1;transform:none;filter:none}}
.show .who{opacity:1}

#hint{
  position:fixed;
  bottom:max(1.8rem, env(safe-area-inset-bottom));
  left:0;
  right:0;
  text-align:center;
  z-index:4;
  font-family:var(--sans);
  font-size:.65rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--ivory-d);
  opacity:0;
  transition:opacity 1s;
  pointer-events:none;
}
#hint.on{opacity:.55;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}

#bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--crim),var(--gold));z-index:6;width:0;transition:width 1s}

.back-library{
  position:fixed;
  top:max(16px, env(safe-area-inset-top));
  left:clamp(16px, 4vw, 24px);
  z-index:20;
  color:var(--ivory-d);
  text-decoration:none;
  font-family:var(--sans);
  font-size:clamp(.58rem, 2vw, .65rem);
  letter-spacing:.22em;
  text-transform:uppercase;
  opacity:.6;
  transition:opacity .3s ease, transform .3s ease;
}
.back-library:hover{opacity:1;transform:translateX(-3px)}

#cta{
  position:fixed;
  left:0;
  right:0;
  bottom:max(1.8rem, env(safe-area-inset-bottom));
  min-height:2rem;
  margin:0;
  z-index:10;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:0 16px;
}

.choices{
  display:flex;
  flex-direction:column;
  gap:.75rem;
  width:100%;
  max-width:380px;
  align-items:center;
}
.btn{
  font-family:var(--sans);
  font-size:clamp(.7rem, 2.2vw, .76rem);
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--ivory);
  background:rgba(10,8,7,.65);
  border:1px solid rgba(194,161,90,.55);
  padding:.85rem 1.6rem;
  width:100%;
  max-width:min(320px, 85vw);
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  transition:background .4s,border-color .4s,color .4s,box-shadow .4s;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.btn:hover,.btn:focus-visible{
  background:var(--crim-d);
  border-color:var(--gold);
  box-shadow:0 0 25px rgba(122,18,38,.45);
  outline:none;
}
.btn.warm:hover,.btn.warm:focus-visible{background:rgba(224,164,88,.14);box-shadow:0 0 25px rgba(224,164,88,.3)}
.btn.ghost{border-color:rgba(239,230,214,.2);color:var(--ivory-d)}

.end{
  display:flex;
  flex-direction:column;
  gap:.8rem;
  align-items:center;
  width:100%;
}

/* Fullscreen Button */
#fullscreen-btn{
  position:fixed;
  bottom:max(16px, env(safe-area-inset-bottom));
  right:16px;
  z-index:30;
  background:rgba(10, 8, 7, 0.6);
  border:1px solid rgba(194, 161, 90, 0.4);
  color:var(--ivory);
  border-radius:50%;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  cursor:pointer;
  transition:border-color 0.3s, background 0.3s;
}
#fullscreen-btn:hover{
  background:var(--crim-d);
  border-color:var(--gold);
}

@media (prefers-reduced-motion:reduce){
  #bg,.fog i,.grain,#hint.on{animation:none}.w{animation-duration:.01s}#fade{transition-duration:.01s}
}
</style>
</head>
<body class="warm">
<div id="bar"></div>
<a href="chapters.html" class="back-library">← BACK TO CHAPTERS</a>
<div id="stage" role="button" tabindex="0" aria-label="Advance story">
  <div id="bg"></div>
  <div class="fog"><i></i><i></i></div>
  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="vig"></div><div class="grain"></div>
  <div id="view" aria-live="polite"><div id="lines"></div><div id="cta"></div></div>
  <div id="fade" class="on"></div>
</div>

<button id="fullscreen-btn" aria-label="Enter fullscreen">⛶</button>

<script>
(function(){
"use strict";
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function n(x,m,br){return{t:"n",x:x,m:m,br:br}}
function s(w,x,m,br){return{t:"s",w:w,x:x,m:m,br:br}}
function T(x,m){return{t:"title",x:x,m:m,br:1}}
function K(x){return{t:"big",x:x}}
function CUT(ms){return{t:"cut",ms:ms}}
var D="dhaks",B="bangchan",A="afu",M="minho";

var S1=[
T("Chapter V","warm"),
{t:"big",x:"The One Who Came Back"},
n("Two years passed.","warm",1),
n("Ken was four now, with a wooden sword and a habit of narrating everything he did.|Afu had grown taller, and sharper-tongued."),
n("Dhaks was pregnant with Bangchan's child.|Bangchan pretended not to hover.|He hovered anyway."),
n("For two years, nothing came looking for them.|No ghosts from the past.|No unfinished stories.|Just a family."),
n("Ken ran circles around the garden, defeating invisible enemies."),
s(A,"You're getting slow, Dhaks. Even the baby's embarrassed."),
s(D,"The baby has excellent taste. It likes me."),
n("Bangchan set a cup of warm milk beside her without a word.|She watched him kneel to fix Ken's grip on the sword, patient and quiet."),
n("She thought the past had finally stayed where it belonged.")
];

var S2=[
T("Late Evening","cold"),
n("The house was quiet. Ken was asleep. Afu was reading upstairs.|Dhaks sat by the lamp, one hand on her stomach, listening to the rain."),
K("Knock."),
K("Knock."),
n("Slower this time.|Patient.|As if whoever it was had waited a long time to knock."),
n("Bangchan was somewhere upstairs.|She pushed herself up and went to the door alone."),
n("A man stood in the rain.|He looked older.|Thinner.|Tired."),
n("But she knew those eyes.|Dhaks forgot how to breathe."),
s(M,"Did you really think I was dead?","cold"),
CUT(2000)
];

var S3=[
n("Her hand slipped from the door. She could not speak."),
s(D,"Minho...?"),
s(M,"You look different."),
n("A long pause. Rain on the porch."),
s(D,"You're alive."),
s(M,"I am."),
n("Two years ago, she had buried him in her heart.|Now he was standing in front of her.")
];

var S4=[
n("He didn't step inside. He stood at the edge of the light, as if unsure he had the right."),
n("He had gone looking for his father, not knowing what waited for him.|He survived. Barely.|He built a small, quiet life far away.|And never stopped thinking about her.|Eventually, he found his way back."),
s(M,"I thought I would come back to you."),
s(D,"You never came."),
s(M,"I know."),
s(D,"I waited."),
n("The rain filled the silence.|Neither of them tried to fill it."),
s(M,"I'm sorry.")
];

var S5=[
n("A small sound behind her. Bare feet on wood.|Ken stood in the hallway in his pyjamas, a stuffed wolf dangling from one hand."),
n("Minho saw him.|And did not move at all.|Something in the tilt of the boy's head. The line of his jaw.|Something he had seen in mirrors."),
s(M,"Who's that?"),
n("Dhaks's throat closed.|She had imagined this moment a thousand ways.|In none of them was she ready."),
s(D,"His name is Ken."),
s(M,"How old is he?"),
n("She didn't answer immediately."),
s(D,"Four."),
n("Silence.|She watched him count backwards through years he never had."),
s(M,"Dhaks..."),
n("She looked away."),
s(D,"He's yours.","cold"),
CUT(2000)
];

var S6=[
n("Ken tugged her sleeve, sleepy, and hid half his face behind her leg."),
n("Minho crouched slowly, as if the boy might vanish.|He didn't reach out. He only looked."),
n("He had missed his first word.|His first step.|Every birthday.|Every fever.|Every night he should have been there."),
n("He wasn't angry. Not at Ken. Not at her.|Only a hollow kind of grief."),
s(M,"He doesn't know me."),
s(D,"No."),
s(M,"Does he know my name?"),
s(D,"He knows that his father loved him.")
];

var S7=[
n("Afu appeared in the hall without a sound, scooped Ken up, and carried him back to bed."),
n("A step on the stairs. Then another.|Bangchan came down slowly, and saw the open door, the rain, the stranger."),
n("Everything stopped.|He knew exactly who this was.|No shouting. No fists.|Just silence, between two men."),
n("Then Minho's gaze drifted down.|To Dhaks.|To the curve of her stomach under her hand.|He understood. She had built another life."),
s(M,"You moved on."),
s(D,"I thought you were dead."),
n("Minho looked at Bangchan, waiting for the smirk.|It never came."),
s(B,"She waited for you."),
s(B,"Longer than you know.")
];

var S8=[
n("Minho's voice was barely there."),
s(M,"Did you love him?"),
n("Dhaks closed her eyes.|There was no answer that wouldn't hurt someone."),
s(D,"Yes."),
s(D,"But I loved you too."),
n("Minho looked at her for a long time.|This was not simple anymore.|There was history.|There was Ken.|There was a life already built, in his absence."),
s(B,"You came back."),
s(B,"But she isn't the same person you left behind.","cold")
];

var S9=[
T("Later That Night","cold"),
n("The house was silent again. Minho had gone.|Not far. Just far enough to give them the night."),
n("Dhaks sat alone in the dim light, an old photograph in her hands.|A younger version of her, laughing.|Beside her, a boy with a crooked smile."),
n("Down the hall, the door stood ajar.|Bangchan and Ken, asleep.|The boy's small hand lost in Bangchan's larger one."),
n("One was the love she lost.|One was the man who stayed.|And now both were standing in front of her."),
n("For the first time...|Dhaks didn't know what her heart was asking her to choose."),
CUT(2000)
];

var END=[
{t:"title",x:"Chapter V",m:"cold",br:1},
{t:"big",x:"The One Who Came Back"},
n("Some people leave.|Some people stay.|And some people come back...|...when you've finally learned how to live without them."),
{t:"end"}
];

var queue=[].concat(S1,S2,S3,S4,S5,S6,S7,S8,S9,END),qi=0,busy=false,
    view=document.getElementById("view"),lines=document.getElementById("lines"),cta=document.getElementById("cta"),
    fade=document.getElementById("fade"),bar=document.getElementById("bar");

function mood(m){if(m==="neutral"){document.body.className=""}else if(m){document.body.className=m}}
function wait(ms){return new Promise(function(r){setTimeout(r,reduce?30:ms)})}

function render(b){
  lines.innerHTML="";
  var d=document.createElement("div");d.className="beat";var n=0;
  if(b.t==="s"){
    var who=document.createElement("div");who.className="who "+b.w;
    who.textContent=b.w.charAt(0).toUpperCase()+b.w.slice(1);d.appendChild(who);
  }
  b.x.split("|").forEach(function(line){
    var el=document.createElement("p");
    el.className="txt "+(b.t==="s"?"say":b.t==="big"?"big":b.t==="title"?"sm":"nar");
    line.split(" ").forEach(function(w){
      var sp=document.createElement("span");sp.className="w";sp.textContent=w;
      sp.style.animationDelay=(reduce?0:n*70)+"ms";el.appendChild(sp);el.appendChild(document.createTextNode(" "));n++;
    });
    d.appendChild(el);
  });
  lines.appendChild(d);
  return n*70+700;
}

function showContinue(){
  var hint=document.createElement("div");
  hint.id="cont";
  hint.textContent="TAP TO CONTINUE";
  hint.style.opacity="0";
  hint.style.fontFamily="var(--sans)";
  hint.style.fontSize=".65rem";
  hint.style.letterSpacing=".28em";
  hint.style.textTransform="uppercase";
  hint.style.color="var(--ivory-d)";
  hint.style.cursor="pointer";
  hint.style.transition="opacity 1s ease";
  hint.style.animation="pulse 2.6s ease-in-out infinite";

  hint.addEventListener("click",function(e){
    e.stopPropagation();
    if(busy) advance();
  });

  cta.appendChild(hint);

  setTimeout(function(){
    hint.style.opacity=".55";
  },reduce?20:150);
}

function showEnd(){
  lines.innerHTML="";
  cta.innerHTML='<div class="end"><a class="btn" href="chapter6.html?start=1">Continue to Chapter VI →</a><a class="btn ghost" href="./index.html">Back to Story</a></div>';
  bar.style.width="100%";
  setTimeout(function(){var f=cta.querySelector("a");if(f)f.focus({preventScroll:true})},700);
}

async function step(){
  var b=queue[qi];busy=false;
  bar.style.width=Math.min(100,qi/queue.length*100)+"%";
  if(b.t==="cut"){
    fade.classList.add("on");await wait(1000);lines.innerHTML="";
    await wait(b.ms);fade.classList.remove("on");await wait(500);
    qi++;return step();
  }
  if(b.br&&qi>0){fade.classList.add("on");await wait(1000);lines.innerHTML="";mood(b.m);fade.classList.remove("on");await wait(400)}
  else mood(b.m);
  if(b.t==="end"){showEnd();return}
  var d=render(b);
  await wait(d);
  busy=true;showContinue();
}

async function advance(){
  if(!busy)return;busy=false;
  cta.innerHTML="";
  var cur=lines.firstChild;if(cur){cur.style.transition="opacity .5s";cur.style.opacity=0}
  await wait(550);
  qi++;step();
}

document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" "&&e.key!=="ArrowRight")return;
  if(e.target&&e.target.closest&&e.target.closest(".btn"))return;
  var c=document.getElementById("cont");
  if(c&&busy){e.preventDefault();advance()}
});

document.getElementById("stage").addEventListener("click",function(e){
  if(e.target.closest&&e.target.closest(".btn,#fullscreen-btn"))return;
  if(document.getElementById("cont")&&busy)advance();
});

/* Embers */
(function(){
  var cv=document.getElementById("embers"),cx=cv.getContext("2d"),P=[],W,H;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  size();addEventListener("resize",size);
  var n=reduce?0:38;
  for(var k=0;k<n;k++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.4,s:Math.random()*.25+.08,o:Math.random()*.5+.15,d:Math.random()*6});
  var t=0;
  function loop(){
    t+=.01;cx.clearRect(0,0,W,H);
    var warm=document.body.classList.contains("warm");
    P.forEach(function(p){
      p.y-=p.s;p.x+=Math.sin(t+p.d)*.25;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);
      cx.fillStyle=(warm?"rgba(224,164,88,":"rgba(194,80,70,")+(p.o*(.6+.4*Math.sin(t*3+p.d)))+")";cx.fill();
    });
    requestAnimationFrame(loop);
  }
  if(n)loop();
})();

setTimeout(function(){fade.classList.remove("on");setTimeout(step,800)},300);
})();

/* Fullscreen Controller */
(function () {
  const button = document.getElementById("fullscreen-btn");
  if (!button) return;

  button.addEventListener("click", async function (e) {
    e.stopPropagation();
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.log("Fullscreen is unavailable in this browser.");
    }
  });
})();
</script>
</body>
</html>
