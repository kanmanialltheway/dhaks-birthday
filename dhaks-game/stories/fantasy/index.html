<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heirs of the Crown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">

<style>
:root{
  --black:#070706;
  --velvet:#120d09;
  --gold-pure:#f3e3be;
  --gold-warm:#c9ae78;
  --gold-dark:#876735;
  --ivory:#f8f3ea;
  --serif-title:"Cinzel Decorative","Cinzel",Georgia,serif;
  --serif-royal:"Cinzel",Georgia,serif;
  --serif-poetic:"Cormorant Garamond",Georgia,serif;
  --sans:"Montserrat","Inter",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  background: var(--black);
  color: var(--ivory);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
}

a{color:inherit;text-decoration:none}
a:focus-visible{outline:1px solid var(--gold-warm);outline-offset:8px}

/* ---------- Royal Backdrop & Depth Layers ---------- */
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}

.palace-plate{
  position:absolute;
  inset:-5%;
  background:
    radial-gradient(ellipse 65% 50% at 50% 90%,rgba(184,140,70,.22),transparent 75%),
    linear-gradient(180deg,rgba(7,7,6,.75) 0%,rgba(18,13,9,.82) 50%,rgba(7,7,6,.92) 100%),
    url("assets/palace-bg.jpg") center/cover no-repeat;
  will-change:transform;
  transition:transform 1.8s var(--ease);
}

/* Velvet & Gold Vignette */
.vignette{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 80% 70% at 50% 50%,transparent 30%,rgba(4,4,3,.85) 90%),
    linear-gradient(180deg,rgba(4,4,3,.6) 0%,transparent 25%,transparent 70%,rgba(4,4,3,.8) 100%);
}

.shaft-gold{
  position:absolute;
  top:-20%;
  width:22%;
  height:140%;
  transform:skewX(-20deg);
  background:linear-gradient(180deg,rgba(201,174,120,.12) 0%,rgba(201,174,120,.03) 70%,transparent 100%);
  filter:blur(35px);
  animation:drift 28s ease-in-out infinite alternate;
}
.shaft-gold:nth-child(1){left:15%}
.shaft-gold:nth-child(2){left:65%;animation-delay:-12s;animation-duration:34s;opacity:.7}

canvas#embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- Navigation ---------- */
.back{
  position:fixed;
  top:max(28px,env(safe-area-inset-top));
  left:clamp(22px,4vw,56px);
  z-index:20;
  font-size:.68rem;
  letter-spacing:.38em;
  text-transform:uppercase;
  color:rgba(248,243,234,.6);
  transition:color .4s ease;
  display:inline-flex;
  align-items:center;
  gap:10px;
}
.back span{transition:transform .4s ease}
.back:hover{color:var(--gold-warm)}
.back:hover span{transform:translateX(-5px)}

/* ---------- Main Throne Stage ---------- */
.crown-stage{
  position:relative;
  z-index:10;
  min-height:100vh;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 24px;
}

.content{
  max-width:920px;
  animation:regalRise 1.6s var(--ease) forwards;
}

/* Royal Seal Crest */
.crest{
  display:inline-block;
  margin-bottom:20px;
}
.crest svg{
  width:34px;
  height:34px;
  stroke:var(--gold-warm);
  fill:none;
  stroke-width:1.2;
  filter:drop-shadow(0 0 14px rgba(201,174,120,.45));
}

.eyebrow{
  font-family:var(--sans);
  font-size:clamp(.7rem,.95vw,.82rem);
  font-weight:400;
  letter-spacing:.65em;
  text-transform:uppercase;
  color:var(--gold-warm);
  padding-left:.65em;
  margin-bottom:14px;
}

/* Master Royal Title */
.title{
  font-family:var(--serif-title);
  font-size:clamp(2.6rem,7.5vw,5.8rem);
  font-weight:700;
  line-height:1.06;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--gold-pure);
  background:linear-gradient(180deg,#ffffff 0%,#f5e5c9 35%,#c9ae78 70%,#7a5a27 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 22px rgba(184,140,70,.35)) drop-shadow(0 0 60px rgba(135,103,53,.25));
}

/* Architectural Royal Divider */
.ornament{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:24px auto;
}
.ornament .line{
  width:80px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,174,120,.65),transparent);
}
.ornament .diamond{
  width:6px;
  height:6px;
  background:var(--gold-warm);
  transform:rotate(45deg);
  box-shadow:0 0 8px var(--gold-warm);
}

.subtitle{
  font-family:var(--serif-poetic);
  font-size:clamp(1.2rem,2.1vw,1.55rem);
  font-style:italic;
  font-weight:300;
  line-height:1.6;
  color:rgba(248,243,234,.9);
  max-width:32ch;
  margin:0 auto 42px;
  text-shadow:0 2px 18px rgba(0,0,0,.9);
}

/* Velvet Pill Interactive Button */
.enter{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 42px;
  font-family:var(--sans);
  font-size:.76rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--gold-pure);
  border-radius:100px;
  isolation:isolate;
  cursor:pointer;
  transition:transform .5s var(--ease),text-shadow .5s ease;
}

.enter::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  z-index:-1;
  background:radial-gradient(ellipse at 50% 120%,rgba(201,174,120,.24),rgba(18,13,9,.88) 75%);
  border:1px solid rgba(201,174,120,.5);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:border-color .5s ease,box-shadow .5s ease,background .5s ease;
}

.enter:hover{
  transform:translateY(-3px);
  text-shadow:0 0 16px rgba(243,227,190,.7);
}
.enter:hover::before{
  background:radial-gradient(ellipse at 50% 120%,rgba(201,174,120,.42),rgba(18,13,9,.92) 75%);
  border-color:var(--gold-warm);
  box-shadow:0 10px 40px -10px rgba(184,140,70,.45),0 0 30px rgba(201,174,120,.2);
}

.enter span{
  display:inline-block;
  margin-left:10px;
  transition:transform .4s var(--ease);
}
.enter:hover span{transform:translateX(5px)}

/* ---------- Keyframes ---------- */
@keyframes regalRise{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
@keyframes drift{
  from{transform:skewX(-20deg) translateX(-4vw);opacity:.5}
  to{transform:skewX(-20deg) translateX(4vw);opacity:.9}
}

@media(max-width:640px){
  .title{letter-spacing:.08em;font-size:clamp(2.2rem,10vw,3.4rem)}
  .subtitle{font-size:1.15rem;margin-bottom:34px}
  .ornament .line{width:50px}
}
</style>
<style>
@media (max-width: 768px) and (orientation: portrait) {
  body {
    visibility: hidden;
  }
}
</style>
</head>

<body>

<a class="back" href="../../index.html#library">
  <span>←</span> Back to Library
</a>

<div class="scene" aria-hidden="true">
  <div class="palace-plate" id="palacePlate"></div>
  <div class="shaft-gold"></div>
  <div class="shaft-gold"></div>
  <canvas id="embers"></canvas>
  <div class="vignette"></div>
</div>

<main class="crown-stage">
  <div class="content">

    <div class="crest">
      <svg viewBox="0 0 24 24">
        <path d="M3 18h18l-2-11-5 4-2-7-2 7-5-4z"/>
        <circle cx="12" cy="4" r="1"/>
      </svg>
    </div>

    <div class="eyebrow">A Historical Royal Romance</div>

    <h1 class="title">Heirs of the Crown</h1>

    <div class="ornament">
      <div class="line"></div>
      <div class="diamond"></div>
      <div class="line"></div>
    </div>

    <p class="subtitle">
      Three hearts were never meant to survive the weight of an imperial throne.
    </p>

    <a class="enter" href="chapters.html">
      Enter the Kingdom <span>→</span>
    </a>

  </div>
</main>

<script>
(function(){
  var c = document.getElementById('embers'),
      ctx = c.getContext('2d'),
      W, H, embers = [],
      dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = c.width = window.innerWidth * dpr;
    H = c.height = window.innerHeight * dpr;
  }

  function spawnMote(firstRun){
    return {
      x: Math.random() * W,
      y: firstRun ? Math.random() * H : H + 10,
      r: (0.7 + Math.random() * 1.8) * dpr,
      vy: -(0.3 + Math.random() * 0.7) * dpr,
      vx: (Math.random() - 0.5) * 0.25 * dpr,
      alpha: 0.15 + Math.random() * 0.6,
      sway: Math.random() * 6.28,
      swaySpeed: 0.012 + Math.random() * 0.016
    };
  }

  function init(){
    resize();
    embers = [];
    var count = Math.round(Math.min(75, innerWidth / 14));
    for (var i = 0; i < count; i++) {
      embers.push(spawnMote(true));
    }
  }

  function loop(){
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < embers.length; i++) {
      var e = embers[i];
      e.sway += e.swaySpeed;
      e.y += e.vy;
      e.x += e.vx + Math.sin(e.sway) * 0.35 * dpr;

      if (e.y < -15 || e.x < -20 || e.x > W + 20) {
        embers[i] = spawnMote(false);
        continue;
      }

      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(201, 174, 120, ' + e.alpha + ')';
      ctx.shadowBlur = 8 * dpr;
      ctx.shadowColor = 'rgba(243, 227, 190, 0.4)';
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', init);
  init();
  loop();

  if (window.matchMedia('(pointer:fine)').matches) {
    var plate = document.getElementById('palacePlate');
    window.addEventListener('mousemove', function(ev) {
      var nx = (ev.clientX / window.innerWidth) - 0.5;
      var ny = (ev.clientY / window.innerHeight) - 0.5;
      plate.style.transform = 'translate3d(' + (-nx * 18) + 'px, ' + (-ny * 12) + 'px, 0) scale(1.03)';
    });
  }
})();
</script>
  <button id="fullscreen-btn" aria-label="Enter fullscreen">
    ⛶
</button>

<script>
(function () {
    const button = document.getElementById("fullscreen-btn");

    if (!button) return;

    button.addEventListener("click", async function () {
        try {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (error) {
            console.log("Fullscreen is unavailable in this browser.");
        }
    });
})();
</script>
</body>
