<script>
(function(){
'use strict';
/* ---------- STORY ---------- */
var N=function(t){return{n:t}},D=function(w,t){return{w:w,t:t}},BG=function(k){return{bg:k}};
var story=[
BG('corridor'),
N('The rain had thinned to mist when Eunsin crept back through the palace. The long corridors lay silent under the moon, and the paper doors glowed pale blue.'),
N('He walked more lightly than he had in years. He was smiling, and no one was there to see it.'),
D('Yeon','You are late, and you are smiling. I do not know which alarms me more.'),
D('Eunsin','Do you never sleep?'),
D('Yeon','Not while the heir of the kingdom climbs walls in the dark. Your sleeves are wet through, Your Highness.'),
D('Eunsin','It rained.'),
D('Yeon','And the princess?'),
N('Eunsin said nothing. He looked at the courtyard, where drops still fell from the eaves one at a time.'),
{q:'How does Eunsin answer?',o:[
 {l:'Tell the quiet truth',b:[D('Eunsin','She asked who I was, and I did not answer. It is the first time I have wished to.')]},
 {l:'Smile and say nothing',b:[N('He only smiled, and Yeon looked at that smile for a long moment before he understood.')]}]},
D('Yeon','You gave her no name?'),
D('Eunsin','I gave her Eunsik. It is the only honest thing I could.'),
D('Yeon','It is not honest at all, my friend. But it is kind, and I think you know the difference.'),
D('Eunsin','She would not look at me the same, if she knew.'),
D('Yeon','Then you must decide how long a secret can be kept before it becomes a wound.'),
N('Eunsin had no answer. Somewhere beyond the walls, a night bird called, and he stood listening a long time.'),

BG('chamber'),
N('In the guest pavilion, one candle still burned. Suan sat by the window with the night air on her face and her damp hair loose on her shoulders.'),
N('In her hands lay a strip of rough black cloth. He had left it on a branch when the rain began, and she had carried it back without telling anyone.'),
{q:'What does Suan do with the cloth?',o:[
 {l:'Hold it to the candlelight',b:[N('Its threads were coarse and plain. Nothing royal in it at all. She turned it slowly in the light and thought that was exactly why she liked it.')]},
 {l:'Tuck it into her sleeve',b:[N('She folded it small and slid it into her sleeve, near her heart, like something that might be taken from her.')]}]},
N('She remembered the rain on the pines. His hand around hers. And a voice saying that he was glad she had come.'),
D('Suan','(softly) I do not know who you are, Eunsik. But I know how I feel when I am near you.'),
N('That was not wise. She knew it. She did not care to be wise tonight.'),

BG('garden'),
N('Morning came gently. The plum and peony beds of the palace garden were heavy with dew, and the petals drifted down on the stones.'),
N('Suan walked alone, finding in the quiet what the court never gave her. Then a bright voice came from behind a flowering branch.'),
D('Haneul','Are you lost? Everyone is, the first week. The palace has too many gates and not enough reasons for them.'),
N('A young woman stepped out, plainly dressed, with a basket of cut flowers on her arm and a smile as quick as a bird.'),
{q:'How does Suan answer her?',o:[
 {l:'Ask who she is',b:[D('Suan','And who are you, to know the palace so well?'),D('Haneul','Someone who lives here and has far too many rules. Will that do?')]},
 {l:'Answer lightly',b:[D('Suan','Perhaps I am lost on purpose. It is the only way to see anything alone.'),D('Haneul','Then you are the first sensible guest I have met.')]}]},
D('Haneul','I am Haneul. You must be the princess from the neighbouring dynasty. Everyone whispers about you in the corridors.'),
D('Suan','Everyone whispers about me in every corridor I have walked. It is tiresome.'),
D('Haneul','Oh, I know. They whisper about me too. They say I am spoiled, and they are right.'),
N('Suan laughed. She had not laughed with another woman since leaving home.'),
D('Haneul','Come and help me with these flowers. My brothers think I only break things.'),
N('They sat on a stone bench, sorting peonies. And as the morning went on, the talk turned from flowers to freedom.'),
D('Suan','My father wishes to place me in a marriage, as one places a seal on a letter.'),
D('Haneul','Father and brothers watch over me like a candle in a wind. I cannot step into the courtyard without three guards pretending not to follow me.'),
D('Suan','So we are both caged, only in different silks.'),
D('Haneul','Yes! Exactly that.'),
N('Two young women, strangers an hour before, sat among the flowers and spoke freely. It was the first time either of them had done so in a long while.'),
D('Haneul','Can you keep a secret, Suan?'),
D('Suan','I am keeping three already. One more is no burden.'),
D('Haneul','There is someone I love. He is a knight.'),
N('Suan turned, surprised. Haneul would not meet her eyes. She was turning a peony in her fingers, petal by petal.'),
D('Haneul','I am the king\'s daughter. And he is only a knight. The kingdom will never allow it, and he knows it better than I.'),
N('So she was the princess of this house. Suan looked at her again, and she did not see a spoiled child. She saw a woman choosing bravely.'),
D('Suan','You are not asking my judgment. But I will give you something better. I believe you.'),
D('Haneul','You do not think me foolish?'),
D('Suan','I think it is the opposite of foolish to know your own heart in a palace like this.'),
N('Haneul squeezed her hand. For the first time that morning, she did not seem like a princess at all.'),

BG('courtyard'),
N('At dusk the archery courtyard lay empty, the straw targets casting long shadows over the stones. A single bow hummed.'),
N('A slim figure drew her arm back, held her breath, and released. The arrow struck the centre of the target with a clean, bright sound.'),
N('At the far end of the courtyard, a tall shape in a knight\'s dark robe stood at a pillar, hand resting on a sword hilt, watching.'),
D('Yeon','You have lowered your elbow again, Princess.'),
D('Haneul','I have not. You are only late.'),
D('Yeon','I was here before the sun set.'),
D('Haneul','Then you watched me a long time, and said nothing.'),
N('He did not answer. The silence said what he could not. Haneul crossed the stones and held out a length of pale blue ribbon from her sleeve.'),
D('Haneul','Take it. Keep it where no one will find it.'),
D('Yeon','Princess, I cannot take something like—'),
D('Haneul','Yeon.'),
N('He took it. Their fingers touched on the silk, and neither of them moved for a long breath. Then he folded the ribbon inside his sleeve.'),
D('Yeon','If the king knew, he would see me gone from the palace by morning.'),
D('Haneul','Father loves me. He may love me enough to listen.'),
D('Yeon','Kings love their daughters. But they also love their treaties.'),
D('Haneul','Then I will choose my own life, and make him see it.'),
D('Yeon','I would rather lose my sword than be the cause of your ruin.'),
N('She looked at the darkening sky, then back at him, and said nothing. It was not an answer. But it was not a refusal either.'),


BG('pavilion'),
N('That night the guest pavilion glowed with a single warm lantern. Haneul had come by quietly, and the two women sat with tea between them.'),
D('Haneul','You are thinking of someone. You have been looking at your sleeve for a quarter of an hour.'),
D('Suan','Am I so plain?'),
D('Haneul','Only to someone who is also in love.'),
D('Suan','I did not say that word.'),
D('Haneul','You did not need to.'),
N('Suan laughed, and then grew quiet. Something in her face softened, as if she were looking at a faraway road.'),
D('Suan','He goes by Eunsik. I met him in the festival crowd, masked in black. I thought him a thief.'),
N('Haneul stilled. She kept her face calm, though her heart had suddenly begun to race.'),
D('Suan','He cleared the road for my chariot. He spoke to the people as if they were his own. Afterwards he took me through the villages by moonlight, and we walked in the rain.'),
D('Haneul','Did he... show you his face?'),
D('Suan','At the very end. His eyes are blue, a colour I have never seen in anyone else.'),
N('Blue. There was only one person in the whole kingdom with eyes like that, and he was her brother.'),
N('Haneul pressed her lips together to keep from smiling, and felt her heart ache a little for both of them.'),
D('Haneul','He sounds... remarkable.'),
D('Suan','He is hiding something. I can tell. But I find that I do not mind.'),
D('Haneul','(gently) Perhaps he is afraid you will mind.'),
N('Haneul knew the truth, and she kept it. It was not hers to tell. It was Eunsin\'s, and she would trust her brother to find the courage.'),
D('Haneul','Suan, there is something else you should know. It concerns your brother.'),
D('Suan','Wan? What of him?'),
D('Haneul','He looks at me too long, and speaks too gently. I think he has come to care for me. I do not feel the same.'),
{q:'How does Suan receive this?',o:[
 {l:'With surprise',b:[D('Suan','Wan? He has said nothing to me!'),N('She put a hand to her cheek, half laughing, half dismayed.')]},
 {l:'With quiet concern',b:[N('She was silent for a moment. Then she nodded slowly, because she had seen how her brother\'s gaze lingered, and had told herself not to notice.')]}]},
D('Suan','He is good-hearted, Haneul. But he believes that his rank will carry a woman\'s heart. He is wrong.'),
D('Haneul','I do not want to wound him.'),
D('Suan','Then be honest with him, when the time comes. Kindness that hides the truth is only a slower cruelty.'),
D('Suan','And I cannot marry a man simply because two kingdoms wish it. Not even a prince.'),
D('Haneul','I understand that better than you know.'),
N('They sat together by the lantern, and neither felt alone any more.'),

BG('moongarden'),
N('Later, when the palace slept, Haneul slipped out through a gate she was not supposed to know. A small lantern swung from her hand.'),
N('The secret garden lay behind a screen of old cypress, where the moon came down in white threads through the branches.'),
N('He was already there. A knight, standing among the shadows, with a blue ribbon at his sleeve.'),
D('Haneul','You wore it.'),
D('Yeon','I could think of no reason to hide it from the moon.'),
N('For a moment, they stood without speaking, and the lantern between them lit the edge of her sleeve and the edge of his.'),
D('Haneul','Promise me something.'),
D('Yeon','Anything within my power.'),
D('Haneul','Promise that we will find a way. Not tonight, not this season. But that we will not give up.'),
D('Yeon','(quietly) I promise, Haneul. If the world demands a price, let it ask me first.'),
N('Her hand found his. This time neither of them let go.'),
N('Beyond the cypress, in the long shadow of a palace gallery, another figure stood very still. It was Wan, who had followed a distant glimmer of lantern light.'),
N('He did not move. He did not call out. He only watched her, with eyes that were not angry, but sad, and unwilling to understand.'),

BG('palacenight'),
N('The palace slept under a pale moon. The tiled roofs shone like silver water, and the lanterns of the outer gates burned small and gold.'),
N('In one chamber, a prince held a borrowed name against his heart. In another, a princess pressed a strip of black cloth to hers.'),
N('In a hidden garden, a knight and a king\'s daughter swore a promise. And in a dark gallery, a foreign prince watched the light that was not his.'),
N('Three hearts had chosen love.'),
N('None of them knew what the palace would demand in return.')
];

/* ---------- ENGINE ---------- */
var $=function(i){return document.getElementById(i)};
var box=$('box'),who=$('who'),txt=$('txt'),sub=$('sub'),opts=$('opts'),hint=$('hint');
var q=story.slice(),i=0,locked=true,started=false,layers=[$('bgA'),$('bgB')],cur=0,fxOn=true;

function setBg(k){
  var nxt=layers[1-cur];
  nxt.className='bg k-'+k;
  void nxt.offsetWidth;
  nxt.classList.add('on');
  layers[cur].classList.remove('on');
  cur=1-cur;
}
function show(w,t,cls,s){
  who.textContent=w||'';txt.textContent=t||'';txt.className=cls||'';sub.textContent=s||'';
  box.classList.add('in');
}
function next(){
  if(locked)return;
  var b=q[i++];
  if(!b){finish();return}
  locked=true;
  box.classList.remove('in');
  setTimeout(function(){render(b)},b.bg?200:550);
}
function render(b){
  opts.innerHTML='';hint.style.display='none';
    if(b.bg){setBg(b.bg);setTimeout(function(){locked=false;next()},1600);return}
  if(b.n){show('',b.n,'nar');ready()}
  else if(b.w){show(b.w,b.t,'');ready()}
  else if(b.c){
    who.textContent='';txt.className='';txt.textContent='';sub.textContent='';
    txt.innerHTML='<div class="card"><h2></h2></div>';
    txt.querySelector('h2').textContent=b.c[0];
    who.textContent=b.c[1];sub.textContent=b.c[2];
    box.classList.add('in');ready();
  }
  else if(b.q){
    show('Choose',b.q,'');
    b.o.forEach(function(o){
      var el=document.createElement('button');
      el.className='opt';el.type='button';el.textContent=o.l;
      el.addEventListener('click',function(){
        if(el.disabled)return;
        Array.prototype.forEach.call(opts.children,function(x){x.disabled=true});
        q.splice.apply(q,[i,0].concat(o.b));
        locked=false;next();
      });
      opts.appendChild(el);
    });
    opts.firstChild.focus({preventScroll:true});
  }
}
function ready(){hint.style.display='block';setTimeout(function(){locked=false},700)}
function finish(){
  locked=true;box.classList.remove('in');
  setTimeout(function(){$('end').classList.remove('off');var l=document.querySelector('#end .primary');if(l)l.focus({preventScroll:true})},1200);
}
function advance(e){
  if(!started)return;
  if(e&&e.target.closest&&e.target.closest('.opt'))return;
  if(opts.children.length&&!opts.firstChild.disabled)return;
  next();
}
$('stage').addEventListener('click',advance);
document.addEventListener('keydown',function(e){
  if(!started)return;
  if(e.key===' '||e.key==='ArrowRight'||(e.key==='Enter'&&!(e.target.closest&&e.target.closest('button,a')))){e.preventDefault();advance()}
});
$('begin').addEventListener('click',function(){
  started=true;$('intro').classList.add('off');locked=false;
  setTimeout(next,900);
});

/* ---------- PETALS, LEAVES, MOTES ---------- */
var cv=$('fx'),cx=cv.getContext('2d'),P=[],W=0,H=0;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
size();addEventListener('resize',size);
function mk(kind){return{k:kind,x:Math.random(),y:Math.random(),r:kind==='m'?Math.random()*1.6+.6:Math.random()*3+4,v:kind==='m'?-(Math.random()*.0003+.0001):Math.random()*.00035+.00014,s:Math.random()*6,a:Math.random()*6}}
var n;
for(n=0;n<14;n++)P.push(mk('p'));
for(n=0;n<3;n++)P.push(mk('l'));
for(n=0;n<24;n++)P.push(mk('m'));
var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function tick(t){
  cx.clearRect(0,0,W,H);
  P.forEach(function(p){
    p.y+=p.v;p.x+=Math.sin(t/2600+p.s)*.00018+(p.k==='m'?0:.00004);p.a+=.004;
    if(p.k==='m'){
      if(p.y<-.05){p.y=1.05;p.x=Math.random()}
      var al=.22+.22*Math.sin(t/900+p.s);
      var g=cx.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,p.r*6);
      g.addColorStop(0,'rgba(255,205,120,'+al+')');g.addColorStop(1,'rgba(255,170,70,0)');
      cx.fillStyle=g;cx.beginPath();cx.arc(p.x*W,p.y*H,p.r*6,0,6.283);cx.fill();
    }else{
      if(p.y>1.05){p.y=-.05;p.x=Math.random()}
      cx.save();cx.translate(p.x*W,p.y*H);cx.rotate(p.a);cx.scale(1,.55+.35*Math.sin(p.a*1.7));
      cx.fillStyle=p.k==='p'?'rgba(240,205,205,.38)':'rgba(150,110,60,.4)';
      cx.beginPath();cx.ellipse(0,0,p.r,p.r*.55,0,0,6.283);cx.fill();cx.restore();
    }
  });
  if(!still)requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
