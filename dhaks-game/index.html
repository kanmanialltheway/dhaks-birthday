<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>For Dhaks</title>
<meta name="theme-color" content="#06050b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  position: fixed;
  inset: 0;
  background: #06050b;
}

/* Base responsive reset & mobile portrait containment */
@media (max-width: 768px) {
  .scene {
    width: 100%;
    height: 100dvh;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)) 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .library {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    justify-content: flex-start;
    padding-top: calc(32px + env(safe-area-inset-top));
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }

  .library-header {
    margin-bottom: 20px;
    text-align: center;
  }

  .library-title {
    font-size: clamp(1.8rem, 7vw, 2.6rem);
  }

  /* Force cards container into a tidy vertical stack */
  .cards {
    width: 100% !important;
    max-width: 420px !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 16px !important;
    margin: 0 auto !important;
    padding: 0 4px !important;
  }

  /* Prevent individual card containers from overflowing */
  .card, 
  .cards > div,
  .cards a {
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    box-sizing: border-box !important;
  }

  /* Lock all card cover images to fit cleanly within portrait height */
  .card img,
  .cards img,
  .card-cover,
  .card-thumb {
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    max-height: 28dvh !important;
    object-fit: cover !important;
    display: block !important;
    border-radius: 8px !important;
  }
}
</style>
</head>
<body>

<canvas id="atmosphere" aria-hidden="true"></canvas>
<div class="fog" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="sweep" id="sweep" aria-hidden="true"></div>

<!-- SCENE 1: Opening prompt -->
<main class="scene" id="opening" aria-live="polite">
  <div class="lines" id="lines"></div>
  <div class="choices" id="choices" hidden>
    <button class="btn btn-yes" id="yesBtn" type="button">YES</button>
    <button class="btn btn-no" id="noBtn" type="button">NO</button>
  </div>
</main>

<!-- SCENE 2: Story selection library -->
<section class="scene library" id="library" hidden aria-label="Choose your world">
  <header class="library-header">
    <p class="library-eyebrow">A SWEET ESCAPE FROM REALITY</p>
    <h1 class="library-title">Choose Your World</h1>
    <div class="library-divider">
      <span class="line"></span>
      <span class="diamond"></span>
      <span class="line"></span>
    </div>
  </header>

  <div class="cards" id="cards"></div>
</section>

<script src="js/script.js"></script>

</body>
</html>
