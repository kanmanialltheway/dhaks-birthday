<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,
body {

  height: 100dvh;

.bg.on{opacity:1}

}
.hall{

}
.class{

}
.yard{
  background:

}

}

#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 2.5s;z-index:4}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

nav{

#story,#title,#end{

  text-align:center;padding:70px 24px;pointer-events:none;z-index:10;
}

#story .in {
  width: 100%;
  max-width: 38rem;
  max-height: 80dvh;
  overflow: hidden;
  overflow-wrap: anywhere;
  font: 400 clamp(1.15rem, 3.4vh, 1.95rem)/1.45 var(--serif);
  opacity: 0;
  transform: translateY(14px);
  filter: blur(4px);
  transition: opacity .8s ease, transform .8s ease, filter .8s ease;
  text-shadow: 0 2px 20px rgba(4,7,16,.75);
}

#story .in.show {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
}

.sp{

#end{pointer-events:none}

.t1{font:300 12px var(--sans);letter-spacing:.36em;color:var(--rose);text-transform:uppercase}

.t2{font:italic 400 1.25rem var(--serif);color:var(--amber);margin-top:6px}
.t3{font:italic 300 1.1rem var(--serif);color:var(--parchment);opacity:.85;margin-top:24px;max-width:32ch}

/* ---------- Character Reveal Card (Adaptive Landscape & Mobile) ---------- */
#intro{position:fixed;inset:0;z-index:15;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
#intro.show{opacity:1}
.fig{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.fig img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.fig::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}

/* Default Desktop & Tablet Landscape */
.L .fig::after{
  background:linear-gradient(to right,transparent 0%,transparent 32%,rgba(10,18,34,.4) 52%,rgba(10,18,34,.9) 76%,var(--navy) 100%);
}
.R .fig::after{
  background:linear-gradient(to left,transparent 0%,transparent 32%,rgba(10,18,34,.4) 52%,rgba(10,18,34,.9) 76%,var(--navy) 100%);
}

.itext {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48%;
  max-height: calc(100dvh - 90px);
  overflow: hidden;
  padding: 0 4%;
  z-index: 3;
}
.L .itext{right:0;text-align:left}
.R .itext{left:0;text-align:left}

.nm{
  font:400 clamp(1.8rem,4.5vw,3.2rem)/1 var(--serif);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ivory);

.ti{
  font:400 11px var(--sans);letter-spacing:.26em;color:var(--amber);
  margin:10px 0 20px;text-transform:uppercase;
}
.ln{
  font:400 clamp(1.05rem,2vw,1.4rem)/1.55 var(--serif);
  margin-bottom:.7rem;
  opacity:0;
  transform:translateY(12px);
  filter:blur(3px);
  transition:opacity .65s ease,transform .65s ease,filter .65s ease;
  color:var(--parchment);
}
.ln.show{opacity:1;transform:translateY(0);filter:blur(0)}

@media (max-width: 768px) and (orientation: portrait) {
  .fig {
    height: 70dvh;
    top: 0;
    bottom: auto;
  }
  .fig img {
    object-fit: cover;
    object-position: center top;
  }
  .L .fig::after, .R .fig::after {
    background: linear-gradient(to top, var(--navy) 0%, rgba(10,18,34,0.92) 35%, rgba(10,18,34,0.3) 70%, transparent 100%);

  .itext {
    top: auto;
    bottom: 0;
    transform: none;
    width: 100%;
    max-height: 48dvh;
    padding: 0 20px calc(42px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .L .itext, .R .itext {
    left: 0;
    right: 0;
  }
  .nm {
    font-size: clamp(1.4rem, 5vw, 2rem);
  }
  .ti {
    margin: 4px 0 10px;
    font-size: 10px;
  }
  .ln {
    font-size: clamp(0.95rem, 3.6vw, 1.15rem);
    line-height: 1.4;
    margin-bottom: .4rem;
  }
}

#hint{
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:0;right:0;
  text-align:center;
  font:400 10px var(--sans);
  letter-spacing:.32em;
  opacity:.45;
  color:var(--amber);
  animation:pulse 3.6s ease-in-out infinite;
  pointer-events:none;
  text-transform:uppercase;
  z-index:20;
}
@keyframes pulse{50%{opacity:.15}}

/* Fullscreen Button */
#fullscreen-btn{
  position:fixed;
  bottom:max(16px, env(safe-area-inset-bottom));
  right:16px;
  z-index:30;
  background:rgba(10, 18, 34, 0.65);
  border:1px solid rgba(240, 180, 106, 0.4);
  color:var(--ivory);
  border-radius:50%;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  cursor:pointer;
  transition:border-color 0.3s, background 0.3s;
}
#fullscreen-btn:hover{
  background:rgba(110, 42, 58, 0.45);
  border-color:var(--amber);
}

/* Landscape compact screens */
@media (orientation: landscape) and (max-height: 520px) {
  #title, #end, #story {
    padding: 44px 20px 30px;
  }
  h1 {
    font-size: clamp(1.6rem, 6.5vh, 2.8rem);
  }
  .t3 {
    margin-top: 10px;
  }
  #hint {
    bottom: 8px;
    font-size: 9px;
  }
  nav {
    padding-top: 6px;
  }
}
</style>

/* ---------- Engine Code ---------- */
var B=[],pend={},k,m,parts;
S.forEach(function(s){
  if(s[0]==='@'){s.slice(1).split(';').forEach(function(p){var a=p.split('=');pend[a[0]]=a[1]});return}
  var b={};for(k in pend)b[k]=pend[k];pend={};
  if(s==='!end'){b.t='end';B.push(b);return}
  if(s[0]==='!'){
    parts=s.slice(1).split('|');
    for(var i=3;i<parts.length;i++){
      var c={t:'i',id:parts[0],side:parts[1],ti:parts[2],n:i-3,lines:parts.slice(3)};
      if(i===3){for(k in b)c[k]=b[k]}
      B.push(c);
    }
    return;
  }
  m=s.match(SP);
  if(m){b.t='s';b.sp=m[1];b.x=m[2]}else{b.t='s';b.x=s}
  B.push(b);
});

var idx=-1,lock=false,bgi=0,swapTimer;
var $=function(i){return document.getElementById(i)};
var txt=$('txt'),intro=$('intro'),hint=$('hint');

function setBg(n){
  var next=$('b'+(1-bgi)),prev=$('b'+bgi);
  next.className='bg '+n+' on';prev.className='bg '+prev.className.split(' ')[1];
  bgi=1-bgi;
}
setBg('dawn');

/* ---------- Atmosphere Particles (Sun Dust & Motes) ---------- */
var cvDust=$('dust'), cxDust=cvDust.getContext('2d'), dW, dH, motes=[];
function sizeDust(){
  var dpr=Math.min(devicePixelRatio||1,2);
  dW=cvDust.width=innerWidth*dpr;
  dH=cvDust.height=innerHeight*dpr;
  motes=[];
  var count=Math.round(Math.min(75, innerWidth/12));
  for(var i=0;i<count;i++){
    motes.push({
      x:Math.random()*dW,
      y:Math.random()*dH,
      r:(0.6+Math.random()*1.8)*dpr,
      vx:(Math.random()*.12+.02)*dpr,
      vy:(Math.random()-.55)*.12*dpr,
      a:Math.random()*6.28,
      s:.003+Math.random()*.007,
      glow:Math.random()<.25,
      o:.18+Math.random()*.45
    });
  }
}
addEventListener('resize',sizeDust);
sizeDust();

function frameDust(){
  cxDust.clearRect(0,0,dW,dH);
  for(var i=0;i<motes.length;i++){
    var p=motes[i];
    p.a+=p.s;
    p.x+=p.vx+Math.sin(p.a)*.18;
    p.y+=p.vy+Math.cos(p.a*.8)*.12;
    if(p.x>dW+10) p.x=-10;
    if(p.y<-10) p.y=dH+10;
    if(p.y>dH+10) p.y=-10;

    var tw=.5+.5*Math.sin(p.a*2.2);
    var alpha=p.o*tw;
    if(p.glow){
      var g=cxDust.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,'rgba(240,180,106,'+alpha*.8+')');
      g.addColorStop(1,'rgba(227,149,114,0)');
      cxDust.fillStyle=g;
      cxDust.beginPath();cxDust.arc(p.x,p.y,p.r*5,0,6.283);cxDust.fill();
    } else {
      cxDust.fillStyle='rgba(251,246,237,'+alpha+')';
      cxDust.beginPath();cxDust.arc(p.x,p.y,p.r,0,6.283);cxDust.fill();
    }
  }
  requestAnimationFrame(frameDust);
}
requestAnimationFrame(frameDust);

/* ---------- Rain: Soft ambient drizzle ---------- */
var cv=$('rain'),cx=cv.getContext('2d'),W,H,drops=[],raining=false,running=false;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
size();addEventListener('resize',size);
for(var d=0;d<75;d++)drops.push({x:Math.random(),y:Math.random(),l:10+Math.random()*14,v:.6+Math.random()*.7});
function frame(){
  if(!raining&&cv.style.opacity==='0'){running=false;return}
  cx.clearRect(0,0,W,H);cx.strokeStyle='rgba(230,238,250,.22)';cx.lineWidth=1;cx.beginPath();
  drops.forEach(function(p){
    var x=p.x*W,y=p.y*H;
    cx.moveTo(x,y);cx.lineTo(x-p.l*.14,y+p.l);
    p.y+=p.v*.006;p.x-=p.v*.0006;
    if(p.y>1.05){p.y=-.05;p.x=Math.random()*1.1}
    if(p.x<-.05)p.x=1.05;
  });
  cx.stroke();requestAnimationFrame(frame);
}
function setRain(on){
  raining=on;cv.style.opacity=on?1:0;
  if(on&&!running){running=true;requestAnimationFrame(frame)}
  if(!on)setTimeout(function(){if(!raining){running=false;cx.clearRect(0,0,W,H)}},2600);
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function showText(b){
  clearTimeout(swapTimer);
  txt.classList.remove('show');
  swapTimer=setTimeout(function(){
    txt.innerHTML=(b.sp?'<span class="sp">'+b.sp.toUpperCase()+'</span>':'')+(b.sp?'<span class="d">“'+esc(b.x)+'”</span>':esc(b.x));
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        txt.classList.add('show');
      });
    });
  },500);
}

var introId=null;
var introTimers=[];
function showIntro(b){
  var first=introId!==b.id;
  introTimers.forEach(clearTimeout);
  introTimers=[];

  if(first){
    introId=b.id;
    var img=$('iimg');
    img.style.display='';
    img.onerror=function(){img.style.display='none'};
    img.src='../assets/'+b.id+'.png?v=crop1';

    intro.className=b.side;
    $('inm').textContent=b.id==='ayeesha'?'AYEESHA':(b.id==='sunny'?'SUNNY':b.id.toUpperCase());
    $('iti').textContent=b.ti;
    $('ils').innerHTML=b.lines.map(function(l){
      return '<div class="ln">'+esc(l)+'</div>';
    }).join('');

    requestAnimationFrame(function(){
      intro.classList.add('show');
    });
  }

  var ls=$('ils').children;
  for(var i=0;i<=b.n;i++){
    (function(e,i){
      var timer=setTimeout(function(){
        e.classList.add('show');
      }, first ? i*130 : 70);
      introTimers.push(timer);
    })(ls[i],i);
  }
}
function hideIntro(){
  introTimers.forEach(clearTimeout);
  introTimers=[];
  intro.classList.remove('show');
  introId=null;
}
function go(){
  idx++;var b=B[idx];if(!b)return;
  if(b.bg)setBg(b.bg);
  if(b.rain!==undefined)setRain(b.rain==='1');
  if(b.t==='i'){showIntro(b)}
  else{
    if(introId)hideIntro();
    if(b.t==='end'){txt.classList.remove('show');$('end').classList.add('show');hint.style.display='none';return}
    showText(b);
  }
  var nx=B[idx+1];
  hint.textContent=(b.t==='i'&&nx&&nx.t!=='i')?'CONTINUE':'TAP TO CONTINUE';
}
function advance(){
  if(lock||(B[idx]&&B[idx].t==='end'))return;
  lock=true;
  setTimeout(function(){lock=false},320);
  if(idx===-1){$('title').classList.remove('show')}
  go();
}
document.addEventListener('click',function(e){
  if(e.target.closest('a,#fullscreen-btn'))return;
  advance();
});
document.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();advance()}
});
})();

/* Fullscreen Controller */
(function () {
  const button = document.getElementById("fullscreen-btn");
  if (!button) return;

  button.addEventListener("click", async function (e) {
    e.stopPropagation();
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.log("Fullscreen is unavailable in this browser.");
    }
  });
})();
</script>
